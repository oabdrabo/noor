<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      color-scheme:dark;
      --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;
      --surface:#1e1e2e;--surface2:#262638;
      --border:#2a2a3e;--border2:#3a3a52;
      --text:#e4e4ef;--text2:#9898b0;--text3:#6a6a82;
      --accent:#6c8aff;--accent2:#8b6cff;--accent3:#4caf8b;
      --danger:#ef5350;
      --radius:12px;--radius2:16px;
      --font:'Inter',system-ui,sans-serif;
      --font-ar:'Noto Sans Arabic','Inter',sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    a{color:var(--accent);text-decoration:none}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    input{font-family:inherit;color:inherit;background:none;border:none;outline:none}

    .app{max-width:800px;margin:0 auto;padding:20px}

    /* Header */
    header{text-align:center;padding:48px 0 32px}
    header h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
    header p{color:var(--text2);font-size:14px}

    /* Tabs */
    .tabs{display:flex;gap:4px;padding:4px;background:var(--bg2);border-radius:var(--radius);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all .2s}
    .tab:hover{color:var(--text)}
    .tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}

    /* Search */
    .search-box{position:relative;margin-bottom:16px}
    .search-box input{width:100%;padding:14px 48px 14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:15px;transition:border-color .2s}
    .search-box input:focus{border-color:var(--accent)}
    .search-box input[dir=rtl]{text-align:right;padding:14px 16px 14px 48px}
    .search-btn{position:absolute;inset-inline-end:4px;top:4px;bottom:4px;width:40px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
    .search-btn:hover{opacity:.85}
    .search-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2}

    /* Chips */
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
    .chip{padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);transition:all .2s}
    .chip:hover{border-color:var(--accent);color:var(--text)}

    /* Stats bar */
    .stats-bar{display:flex;gap:16px;justify-content:center;padding:12px 0;margin-bottom:24px;color:var(--text3);font-size:13px}
    .stats-bar span{display:flex;align-items:center;gap:4px}
    .stats-bar strong{color:var(--text2)}

    /* Results */
    .results{display:flex;flex-direction:column;gap:12px}
    .result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;transition:border-color .2s}
    .result:hover{border-color:var(--border2)}
    .result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .result-ref{font-size:13px;font-weight:600;color:var(--accent);background:rgba(108,138,255,.1);padding:4px 10px;border-radius:6px}
    .result-score{font-size:12px;color:var(--accent3);font-weight:500}
    .arabic{font-family:var(--font-ar);font-size:24px;line-height:2;direction:rtl;text-align:right;padding:16px;background:var(--bg2);border-radius:var(--radius);margin-bottom:12px;font-weight:600}
    .translation{font-size:14px;color:var(--text2);line-height:1.8}
    .result-footer{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .result-footer button{font-size:12px;color:var(--text3);padding:4px 8px;border-radius:6px;transition:all .2s}
    .result-footer button:hover{background:var(--bg2);color:var(--text)}

    /* Hadith result */
    .hadith-collection{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .hadith-text{font-size:14px;line-height:1.8;color:var(--text2)}

    /* QA answer */
    .qa-answer{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:16px;border-inline-start:3px solid var(--accent)}
    .qa-answer p{font-size:14px;line-height:1.8;color:var(--text)}
    .qa-type{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px}

    /* Count result */
    .count-result{text-align:center;padding:32px}
    .count-number{font-size:48px;font-weight:700;color:var(--accent)}
    .count-label{font-size:14px;color:var(--text2);margin-top:4px}

    /* Themes */
    .theme-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .theme-title{font-size:14px;font-weight:600;margin-bottom:4px}
    .theme-keywords{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
    .theme-kw{font-size:11px;background:var(--bg2);padding:2px 8px;border-radius:4px;color:var(--text2)}
    .theme-size{font-size:12px;color:var(--text3)}

    /* Loading */
    .loading{display:flex;justify-content:center;padding:48px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Empty */
    .empty{text-align:center;padding:48px 20px;color:var(--text3)}
    .empty h3{color:var(--text2);font-size:16px;margin-bottom:4px}
    .empty p{font-size:14px}

    /* Error */
    .error{text-align:center;padding:32px;color:var(--danger);font-size:14px}

    /* Toast */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius);font-size:13px;opacity:0;transition:all .3s;z-index:100}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

    /* Responsive */
    @media(max-width:600px){
      .app{padding:12px}
      header{padding:32px 0 20px}
      header h1{font-size:22px}
      .arabic{font-size:20px;padding:12px}
      .tab{padding:6px 10px;font-size:12px}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="app">
    <header>
      <h1>Noor</h1>
      <p>Quran & Hadith Semantic Search</p>
    </header>

    <!-- Stats -->
    <div class="stats-bar" v-if="stats">
      <span><strong>{{stats.indexed_verses?.toLocaleString()}}</strong> verses</span>
      <span><strong>{{stats.total_hadiths?.toLocaleString()}}</strong> hadiths</span>
      <span><strong>{{stats.status}}</strong></span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab" :class="{active:mode===m.id}" v-for="m in modes" @click="mode=m.id;query=m.example||query">{{m.label}}</button>
    </div>

    <!-- Search -->
    <div class="search-box">
      <input
        ref="searchInput"
        v-model="query"
        :placeholder="currentMode.placeholder"
        :dir="isArabic(query)?'rtl':'ltr'"
        @keydown.enter="search">
      <button class="search-btn" @click="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>

    <!-- Quick chips -->
    <div class="chips" v-if="!results.length && !loading">
      <button class="chip" v-for="s in suggestions" @click="query=s.q;search()">{{s.label}}</button>
    </div>

    <!-- Loading -->
    <div class="loading" v-if="loading"><div class="spinner"></div></div>

    <!-- Error -->
    <div class="error" v-if="error">{{error}}</div>

    <!-- Results -->
    <div class="results" v-if="!loading && !error">

      <!-- QA mode -->
      <template v-if="mode==='qa' && qaAnswer">
        <div class="qa-answer">
          <div class="qa-type">{{qaAnswer.question_type}}</div>
          <p>{{qaAnswer.answer}}</p>
        </div>
        <div class="result" v-for="r in qaAnswer.relevant_verses">
          <div class="result-head">
            <span class="result-ref">{{r.surah}}:{{r.ayah}}</span>
            <span class="result-score">{{pct(r.score)}}</span>
          </div>
          <div class="arabic" v-if="r.text">{{r.text}}</div>
          <div class="translation">{{r.translation}}</div>
        </div>
      </template>

      <!-- Count mode -->
      <template v-else-if="mode==='count' && countResult">
        <div class="count-result">
          <div class="count-number">{{countResult.count.toLocaleString()}}</div>
          <div class="count-label">"{{countResult.word}}" found in {{countResult.total_verses_with_word}} verses</div>
        </div>
        <div class="result" v-for="e in countResult.examples">
          <div class="result-head">
            <span class="result-ref">{{e.surah}}:{{e.ayah}}</span>
            <span class="result-score">{{e.matches}} matches</span>
          </div>
          <div class="translation">{{e.text}}</div>
        </div>
      </template>

      <!-- Themes mode -->
      <template v-else-if="mode==='themes' && themes">
        <div class="results" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
          <div class="theme-card" v-for="(t,id) in themes">
            <div class="theme-title">Cluster {{id}}</div>
            <div class="theme-size">{{t.size}} verses</div>
            <div class="theme-keywords">
              <span class="theme-kw" v-for="k in t.keywords">{{k}}</span>
            </div>
          </div>
        </div>
      </template>

      <!-- Search / Hadith / Similar / Tafsir results -->
      <template v-else>
        <!-- Tafsir note -->
        <div v-if="tafsirData" class="qa-answer" style="margin-bottom:12px">
          <div class="arabic" v-if="tafsirData.verse">{{tafsirData.verse}}</div>
          <div class="translation">{{tafsirData.translation}}</div>
          <p style="margin-top:8px;font-size:13px;color:var(--text3)">{{tafsirData.note}}</p>
        </div>

        <div class="result" v-for="r in results">
          <div class="result-head">
            <span class="result-ref" v-if="r.surah">{{r.surah}}:{{r.ayah}}</span>
            <span class="result-ref" v-else-if="r.collection">
              <span class="hadith-collection">{{r.collection}}</span> #{{r.hadith_number}}
            </span>
            <span class="result-score" v-if="r.score">{{pct(r.score)}}</span>
          </div>
          <div class="arabic" v-if="r.text && isArabic(r.text)">{{r.text}}</div>
          <div class="hadith-text" v-else-if="r.text">{{r.text}}</div>
          <div class="translation" v-if="r.translation">{{r.translation}}</div>
          <div class="result-footer">
            <button @click="copy(r)">Copy</button>
            <button v-if="r.surah" @click="query=r.surah+':'+r.ayah;mode='tafsir';search()">Tafsir</button>
            <button v-if="r.surah" @click="query=r.translation||r.text;mode='search';search()">Similar</button>
          </div>
        </div>
      </template>

      <!-- Empty -->
      <div class="empty" v-if="!loading && !error && !results.length && !qaAnswer && !countResult && !themes && !tafsirData && searched">
        <h3>No results</h3>
        <p>Try different keywords or a different mode</p>
      </div>
    </div>
  </div>

  <div class="toast" :class="{show:toast}">{{toast}}</div>
</div>

<script>
const{createApp,ref,computed,onMounted,nextTick}=Vue

createApp({
  setup(){
    const API='/api'
    const query=ref('')
    const mode=ref('search')
    const loading=ref(false)
    const error=ref('')
    const results=ref([])
    const qaAnswer=ref(null)
    const countResult=ref(null)
    const themes=ref(null)
    const tafsirData=ref(null)
    const stats=ref(null)
    const toast=ref('')
    const searched=ref(false)
    const searchInput=ref(null)

    const modes=[
      {id:'search',label:'Search',placeholder:'Search Quran verses...',example:''},
      {id:'hadith',label:'Hadith',placeholder:'Search hadith collections...',example:''},
      {id:'qa',label:'Q&A',placeholder:'Ask a question about Islam...',example:'What is the importance of prayer?'},
      {id:'similar',label:'Similar',placeholder:'Find similar verses (enter text or reference)...',example:'2:255'},
      {id:'tafsir',label:'Tafsir',placeholder:'Enter verse reference (e.g. 2:255)...',example:'2:255'},
      {id:'count',label:'Count',placeholder:'Count word occurrences...',example:'mercy'},
      {id:'themes',label:'Themes',placeholder:'',example:''},
    ]

    const currentMode=computed(()=>modes.find(m=>m.id===mode.value)||modes[0])

    const suggestions=[
      {label:'Ayatul Kursi',q:'2:255'},{label:'Al-Fatiha',q:'1:1'},
      {label:'Patience',q:'patience'},{label:'Mercy',q:'mercy'},
      {label:'Prayer',q:'What is the importance of prayer?'},
      {label:'Paradise',q:'paradise description'},
      {label:'Prophet Muhammad',q:'Prophet Muhammad'},
      {label:'Forgiveness',q:'forgiveness'},{label:'Justice',q:'justice'},
      {label:'Fasting',q:'Ramadan fasting'},{label:'Marriage',q:'marriage in Islam'},
      {label:'Angels',q:'angels'},
    ]

    function isArabic(t){return t&&/[\u0600-\u06FF]/.test(t)}
    function pct(s){return s!=null?Math.round(s*100)+'%':''}

    async function search(){
      const q=query.value.trim()
      if(!q&&mode.value!=='themes')return
      loading.value=true;error.value='';results.value=[];qaAnswer.value=null;countResult.value=null;themes.value=null;tafsirData.value=null;searched.value=true

      try{
        let data
        switch(mode.value){
          case 'search':
            data=await post(`${API}/search`,{query:q,limit:20})
            results.value=data.results||[]
            break
          case 'hadith':
            data=await post(`${API}/hadith/search`,{query:q,limit:20})
            results.value=data.results||[]
            break
          case 'qa':
            data=await post(`${API}/qa`,{question:q,context_limit:5})
            qaAnswer.value=data
            break
          case 'similar':
            data=await post(`${API}/similar`,{reference:q,query:q,limit:10})
            results.value=data.similar_verses||data.results||[]
            break
          case 'tafsir':
            data=await post(`${API}/tafsir`,{reference:q})
            tafsirData.value=data
            results.value=data.related_verses||[]
            break
          case 'count':
            data=await post(`${API}/count`,{word:q})
            countResult.value=data
            break
          case 'themes':
            data=await get(`${API}/analytics/themes`)
            themes.value=data.themes||{}
            break
        }
      }catch(e){
        error.value=e.message||'Request failed'
      }finally{
        loading.value=false
      }
    }

    async function post(url,body){
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`Error ${r.status}`)
      return r.json()
    }
    async function get(url){
      const r=await fetch(url)
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`Error ${r.status}`)
      return r.json()
    }

    function copy(r){
      const t=r.translation||r.text||''
      const ref=r.surah?`${r.surah}:${r.ayah}`:(r.collection?`${r.collection} #${r.hadith_number}`:'')
      navigator.clipboard.writeText(`${ref}\n${t}`).then(()=>showToast('Copied'))
    }
    function showToast(msg){toast.value=msg;setTimeout(()=>toast.value='',2000)}

    onMounted(async()=>{
      try{stats.value=await get(`${API}/stats`)}catch(e){}
      nextTick(()=>searchInput.value?.focus())
    })

    return{query,mode,modes,currentMode,loading,error,results,qaAnswer,countResult,themes,tafsirData,stats,toast,searched,suggestions,searchInput,isArabic,pct,search,copy}
  }
}).mount('#app')
</script>
</body>
</html>
